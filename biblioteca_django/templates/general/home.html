{% extends "general/layout.html" %}

{% block page_content %}
    <h1>Página principal</h1>
    <h2>¡Bienvenido a Biblioteca!</h2>
    <div class="container">
            {% for book in books %} 
                <article>
                    <p></p>{{book.title}}</p>
                     <img src="{{book.frontpage.url}}" alt="{{book.title}}">
                </article>
            {% empty %}
                <p>No hay libros en la biblioteca.</p>
            {% endfor %}
    </div>
{% endblock %}
