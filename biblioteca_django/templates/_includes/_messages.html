<div class="fixed top-4 right-4 z-50 flex flex-col gap-3 w-72 md:w-96">
    {% for message in messages %}
        <div id="toast-{{ forloop.counter }}" 
             class="flex items-center p-4 rounded-lg shadow-lg border-l-4 transition-opacity duration-500
             {% if message.tags == 'error' %} border-red-500 bg-red-50 text-red-800
             {% elif message.tags == 'success' %} border-green-500 bg-green-50 text-green-800
             {% elif message.tags == 'warning' %} border-yellow-500 bg-yellow-50 text-yellow-800
             {% else %} border-blue-500 bg-blue-50 text-blue-800 {% endif %}">
            
            <div class="flex-grow text-sm font-medium">
                {{ message }}
            </div>

            <!-- Botón para cerrar manualmente -->
            <button onclick="this.parentElement.remove()" class="ml-4 text-gray-400 hover:text-gray-900 focus:outline-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    {% endfor %}
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        {% for message in messages %}
            setTimeout(() => {
                const toast = document.getElementById('toast-{{ forloop.counter }}');
                if (toast) {
                    toast.classList.add('opacity-0'); 
                    setTimeout(() => toast.remove(), 500); 
                }
            }, 5000); // 5000ms = 5 segundos
        {% endfor %}
    });
</script>
