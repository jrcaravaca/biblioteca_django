{% extends "general/layout.html" %}
{% load crispy_forms_tags %}


{% block head_title %}Biblioteca - Eliminar Libro {% endblock %}

{% block page_content %}
    <form action="" method="post">
        {% csrf_token %}
        {{ form }}
        <button class="mb-4 mt-4 cursor-pointer bg-pink-500 hover:bg-pink-600 transition-colors 
                        text-white font-bold py-2 px-4 rounded text-center">
            Eliminar
        </button>
        <a href="{% url "book-detail" book.pk %}" object.pk>Cancelar</a>
    </form>
{% endblock %}
